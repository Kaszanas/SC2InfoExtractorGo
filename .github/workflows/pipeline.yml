name: Pipeline

on:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  e2e-tests:
    uses: ./.github/workflows/e2e_tests.yml
    secrets: inherit

  verify-docker-build:
    if: github.event_name == 'pull_request'
    needs: [lint, e2e-tests]
    uses: ./.github/workflows/docker_build_verify.yml
